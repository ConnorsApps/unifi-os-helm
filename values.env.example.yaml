global:
  postgres:
    connection:
      password: ""   # required unless global.postgres.connection.useExistingSecrets: true
  rabbitmq:
    connection:
      password: ""
      erlangCookie: ""

# Toggle bundled dependencies for this cluster.
rabbitmq:
  enabled: true
  persistence:
    storageClass: ""
postgres:
  enabled: true
  cluster:
    storage:
      storageClass: ""

# ------------------------------------------------------------------
# UniFi Network Application settings
# ------------------------------------------------------------------
unifi:
  # Cluster-specific storage class override.
  storage:
    statefulset:
      storageClassName: ""
      sizes:
        persistent: 10Gi
        data: 10Gi
        srv: 5Gi
        unifi: 10Gi
        log: 5Gi
  # Externally reachable controller address for device inform URL.
  uosSystemIP: "my-unifi-site.com"
  # Gateway API wiring is cluster-specific.
  gateway:
    parentRef:
      name: "private"
      namespace: "istio-system"
    httpRoute:
      enabled: true
      hostname: "my-unifi-site.com"
      sectionName: "https-default"
    tcpRoute:
      enabled: true
      sectionName: "unifi-8080"
    udpRoutes:
      discovery:
        enabled: true
        sectionName: "unifi-ap-discovery"
      stun:
        enabled: true
        sectionName: "unifi-stun"
      syslog:
        enabled: true
        sectionName: "unifi-remote-syslog"

  # Extra pod customization — uncomment whatever your cluster needs.
  # nodeSelector: {}
  # affinity: {}
  # tolerations: []
  # podAnnotations: {}
  # podLabels: {}
  # extraEnv: []
  # extraVolumes: []
  # extraVolumeMounts: []
  # extraInitContainers: []
  # serviceAccountName: ""

  # Scheduling/runtime knobs.
  # priorityClassName: ""
  # terminationGracePeriodSeconds: 90   # systemd-as-PID1 needs time for a clean shutdown
  # topologySpreadConstraints: []
  # runtimeClassName: ""
  # hostAliases: []
  # dnsPolicy: ""
  # dnsConfig: {}

  # Merged on top of the required defaults (privileged: true, runAsUser: 0 for
  # the unifi-os container — needed to run systemd as PID 1).
  # podSecurityContext: {}
  # securityContext: {}

  # Dynamic Resource Allocation (DRA) — e.g. claiming a dedicated NIC so the
  # pod can join the local L2 broadcast domain for AP discovery without hostNetwork.
  # resourceClaims:
  #   - name: nic
  #     resourceClaimTemplateName: unifi-nic-template
  # resources:
  #   claims:
  #     - name: nic

  # Resource overrides for the journalctl/discovery-shim sidecar containers.
  # journalctl:
  #   resources: {}
  # discoveryShim:
  #   resources: {}

  # Per-Service overrides. hotspotService/udpService are separate since UDP
  # is commonly exposed a different way than the main TCP service.
  # service:
  #   type: ClusterIP
  #   annotations: {}
  # hotspotService:
  #   type: ClusterIP
  #   annotations: {}
  # udpService:
  #   type: LoadBalancer
  #   annotations: {}
  #   externalTrafficPolicy: Local   # preserves client source IP for STUN/discovery

# ------------------------------------------------------------------
# Chart-wide extensibility — applied across every object this chart renders.
# ------------------------------------------------------------------
# commonLabels: {}
# commonAnnotations: {}
# imagePullSecrets: []

# ------------------------------------------------------------------
# Backup credentials
# Create a Local UniFi OS user (not cloud): Settings > Admins & Users > Add Admin > Local Access Only.
# Role must be Administrator for UniFi Network.
# ------------------------------------------------------------------
backup:
  enabled: true
  username: backup
  # Password for the local backup user created above.
  password: "change-me"

  # Storage backend URL — supports file://, smb://, s3://, gs://
  # See https://github.com/ConnorsApps/unifi-backup/blob/main/CONFIGURATION.md
  storageUrl: "file://./backups"

  # Same pod customization / scheduling / securityContext / DRA overrides as
  # unifi.* above are available here (nodeSelector, tolerations,
  # priorityClassName, resources, securityContext, resourceClaims, extraEnv,
  # extraVolumeMounts, etc.) — see README.md for the full list.

# ------------------------------------------------------------------
# UniFi Exporter (unpoller) — Prometheus metrics scraper
# Enable one of the three auth options below; disable the others.
# ------------------------------------------------------------------

# Option 1: API key (recommended for UniFi OS 4+)
#   Generate in UniFi OS: Settings > Admins & Users > (your user) > API Key.
# unifiExporter:
#   enabled: true
#   config:
#     apiKey: "your-api-key"

# Option 2: Username + password (plaintext in Helm values)
#   Create a local read-only user: Settings > Admins & Users > Add Admin >
#   Local Access Only. Role: Viewer is sufficient.
# unifiExporter:
#   enabled: true
#   config:
#     username: "metrics"
#     password: "change-me"

# Option 3: Pre-existing Kubernetes Secret
#   Secret must live in the same namespace as the release.
#   It needs either a "password" key, an "api-key" key, or both.
#   Whichever key is present and non-empty will be used; api-key takes priority.
# unifiExporter:
#   enabled: true
#   config:
#     username: "metrics"   # still required when using password auth via existing secret
#   existingSecret:
#     name: "my-unifi-exporter-secret"
#     passwordKey: password   # default; omit if secret only has api-key
#     apiKeyKey: api-key      # default; omit if secret only has password

# Additional collection options (all default to false):
# unifiExporter:
#   config:
#     saveEvents: true      # client connect/disconnect and network events
#     saveAlarms: true      # security and network alarms
#     saveAnomalies: true   # detected network anomalies
#     saveIds: true         # device ID-to-name label mappings
#     hashPii: true         # hash MAC addresses and client names (privacy/compliance)

# Same pod customization / scheduling / securityContext / DRA overrides as
# unifi.* above are available here too (nodeSelector, tolerations,
# priorityClassName, securityContext, resourceClaims, extraVolumes,
# extraVolumeMounts, service.type, etc.) — see README.md for the full list.
