# yaml-language-server: $schema=charts/unifi-os/values.schema.json
# Copy to values.env.yaml (gitignored) and fill in. Every option, with its
# default: charts/unifi-os/values.yaml.
global:
  postgres:
    connection:
      password: ""            # or useExistingSecrets: true (see DATABASE.md)
  rabbitmq:
    connection:
      password: ""
      erlangCookie: ""

postgres:
  enabled: true               # CloudNativePG; false + global.postgres.connection.host for external
  cluster:
    storage:
      storageClass: ""
rabbitmq:
  enabled: true
  persistence:
    storageClass: ""

unifi:
  uosSystemIP: "unifi.example.com"   # address devices use to reach the controller
  storage:
    statefulset:
      storageClassName: ""
  gateway:
    parentRef:
      name: "private"
      namespace: "istio-system"
    httpRoute:
      enabled: true
      hostname: "unifi.example.com"
      sectionName: "https-default"
    tcpRoute:
      enabled: true
      sectionName: "unifi-8080"
    udpRoutes:
      discovery: {enabled: true, sectionName: "unifi-ap-discovery"}
      stun: {enabled: true, sectionName: "unifi-stun"}
      syslog: {enabled: true, sectionName: "unifi-remote-syslog"}
  # Or expose UDP without a gateway:
  # udpService: {type: LoadBalancer, externalTrafficPolicy: Local}

# Local UniFi OS user with the Administrator role
# (Settings > Admins & Users > Add Admin > Local Access Only).
backup:
  enabled: true
  username: backup
  password: "change-me"
  storageUrl: "file://./backups"     # smb://, s3://, gs:// also work

unifiExporter:
  enabled: false
  config:
    apiKey: ""                       # Settings > Admins & Users > <user> > API Key
