# Connections. global.* wins over the chart-local postgres/rabbitmq.connection
# (umbrella charts). MongoDB is embedded in the image and not configurable.
# See DATABASE.md for the credential modes.
global:
  postgres:
    connection:
      host: ""                # external PostgreSQL; derived from the subchart when postgres.enabled
      port: 5432
      database: unifi-core
      user: unifi-core
      password: ""            # chart creates unifi-pg-auth (+ pg-login-<role> when postgres.enabled)
      useExistingSecrets: false  # postgres.enabled only: you create every pg-login-<role> secret
      existingSecret:         # external only: secret holding the app's password
        name: ""
        passwordKey: ""
  rabbitmq:
    connection:
      host: ""                # external RabbitMQ; derived from the subchart when rabbitmq.enabled
      port: 5672
      username: unifi
      password: ""            # required unless existingSecret.name is set
      erlangCookie: ""
      existingSecret:
        name: ""
        passwordKey: ""
        erlangCookieKey: ""
      uri: ""                 # overrides the amqp:// URI built from the fields above

image:
  repository: ghcr.io/connorsapps/unifi-os
  tag: ""                     # default: chart appVersion

# Applied to every object/pod this chart renders (not the subcharts).
commonLabels: {}
commonAnnotations: {}
imagePullSecrets: []

# Workload overrides. unifi, unifiExporter and backup each accept:
#   podAnnotations podLabels nodeSelector affinity tolerations priorityClassName
#   terminationGracePeriodSeconds topologySpreadConstraints runtimeClassName
#   hostAliases dnsPolicy dnsConfig podSecurityContext securityContext
#   resourceClaims (DRA; reference them from resources.claims) extraEnv
#   extraVolumes extraVolumeMounts
# securityContext is merged over each container's required defaults.

# Scheduled backups via https://github.com/ConnorsApps/unifi-backup (CONFIGURATION.md).
# Needs a local UniFi OS user with the Administrator role.
backup:
  enabled: false
  schedule: "0 2 * * *"
  image:
    repository: ghcr.io/connorsapps/unifi-backup
    tag: latest
    pullPolicy: IfNotPresent
  username: backup
  password: ""                # ignored when existingSecret.name is set
  # Stored in the secret (it often holds credentials): file://./backups,
  # smb://user:pass@nas.local/share, s3://bucket?region=us-east-1, ...
  storageUrl: "file://./backups"
  existingSecret:
    name: ""
    passwordKey: password
    storageUrlKey: storageUrl
  # Rendered as config.yaml; schema:
  # https://github.com/ConnorsApps/unifi-backup/blob/main/examples/config.example.yaml
  config:
    # yaml-language-server: $schema=https://raw.githubusercontent.com/ConnorsApps/unifi-backup/refs/heads/main/config.schema.json
    unifi:
      url: ""                 # default: https://unifi.<namespace>.svc.cluster.local
      site: default
      includeDays: 0
      insecure_skip_verify: true
      timeout: 10m
      max_retries: 3
    logging:
      level: info
      format: json
    retention:
      keepLast: 14
  resources:
    requests:
      cpu: 100m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  terminationGracePeriodSeconds: null
  topologySpreadConstraints: []
  runtimeClassName: ""
  hostAliases: []
  dnsPolicy: ""
  dnsConfig: {}
  podSecurityContext: {}
  securityContext: {}
  resourceClaims: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# Prometheus metrics via https://github.com/unpoller/unpoller. Auth, first match wins:
#   config.apiKey (UniFi OS 4+: Settings > Admins & Users > <user> > API Key)
#   config.username + config.password (local Viewer user)
#   existingSecret.name: secret with passwordKey and/or apiKeyKey (config.username
#   still needed for password auth)
unifiExporter:
  enabled: false
  image:
    repository: ghcr.io/unpoller/unpoller
    tag: "v2.34.0"
    pullPolicy: IfNotPresent
  config:
    url: ""                   # default: https://unifi.<namespace>.svc.cluster.local
    username: ""
    password: ""
    apiKey: ""
    verifyTLS: false
    saveSites: true
    saveDpi: true
    saveEvents: false         # client connect/disconnect and network events
    saveAlarms: false
    saveAnomalies: false
    saveIds: false            # device ID-to-name label mappings
    hashPii: false            # hash MACs and client names
    reportErrors: true
  existingSecret:
    name: ""
    passwordKey: password
    apiKeyKey: api-key
  serviceMonitor:
    enabled: false            # needs the Prometheus Operator CRDs
    interval: 30s
    scrapeTimeout: 10s
  service:
    type: ClusterIP
    annotations: {}
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  podAnnotations: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  terminationGracePeriodSeconds: null
  topologySpreadConstraints: []
  runtimeClassName: ""
  hostAliases: []
  dnsPolicy: ""
  dnsConfig: {}
  podSecurityContext: {}
  securityContext: {}
  resourceClaims: []
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []

# RabbitMQ subchart (CloudPirates). It reads the "rabbitmq-auth" secret this chart
# creates from global.rabbitmq.connection; with connection.existingSecret, point
# auth.existingSecret/existingPasswordKey/existingErlangCookieKey at your secret.
rabbitmq:
  enabled: true
  connection: {}
  # Keep .erlang.cookie at 0400: fsGroup must not add group-read.
  podSecurityContext:
    fsGroup: 999
    fsGroupChangePolicy: OnRootMismatch
  auth:
    enabled: true
    username: "unifi"
    existingSecret: "rabbitmq-auth"
    existingPasswordKey: password
    existingErlangCookieKey: erlang-cookie
  persistence:
    enabled: true
    size: 10Gi
    storageClass: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi

# PostgreSQL subchart (CloudNativePG cluster; needs the CNPG operator).
postgres:
  enabled: false
  connection: {}
  fullnameOverride: unifi-postgres
  cluster:
    instances: 1
    # PostgreSQL 14 is a ceiling: ulp-go's SQL ("$1AND") is rejected by 15+,
    # which breaks login. See DATABASE.md before changing this.
    imageName: "ghcr.io/cloudnative-pg/postgresql:14-bookworm"
    storage:
      size: 10Gi
      storageClass: ""
    initdb:
      database: unifi-core
      owner: unifi-core
      secret:
        name: pg-login-unifi-core
    # Each role reads its password from pg-login-<name> (fixed names).
    roles:
      - {name: unifi-core, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-unifi-core}}
      - {name: ulp-go, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-ulp-go}}
      - {name: uid, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-uid}}
      - {name: unifi-credential-server, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-unifi-credential-server}}
      - {name: unifi-directory, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-unifi-directory}}
      - {name: ucs-agent, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-ucs-agent}}
      - {name: ucs-update, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-ucs-update}}
      - {name: unifi-identity-update, ensure: present, login: true, createdb: true, passwordSecret: {name: pg-login-unifi-identity-update}}
  databases:
    - {name: unifi-core, owner: unifi-core}
    - {name: ulp-go, owner: ulp-go}
    - {name: uid, owner: uid}
    - {name: unifi-credential-server, owner: unifi-credential-server}
    - {name: ucs-user-assets, owner: unifi-credential-server}
    - {name: unifi-directory, owner: unifi-directory}
    - {name: ucs-agent, owner: ucs-agent}
    - {name: unifi-identity-update, owner: ucs-update}

unifi:
  # Hostname or IP devices use to reach the controller (set-inform URL).
  uosSystemIP: ""
  tls:
    # kubernetes.io/tls secret for UniFi's nginx (tls.crt, tls.key, optional
    # ca.crt). Empty: self-signed. See TLS.md.
    existingSecret: ""
    certManager:
      enabled: false          # overrides existingSecret
      secretName: unifi-tls
      issuerRef:
        name: ""              # required
        kind: ClusterIssuer
        group: cert-manager.io
      dnsNames: []            # default: [gateway.httpRoute.hostname]
      duration: 2160h
      renewBefore: 360h
    backendTLSPolicy:         # Gateway API: re-encrypt gateway → nginx
      enabled: false
      wellKnownCACertificates: ""  # "System" for public CAs; else caCertificateRef
      caCertificateRef:
        name: ""              # ConfigMap holding the CA
        key: ca.crt
      hostname: ""            # required; SNI name on the certificate
  resources:
    requests:
      cpu: 500m
      memory: 2Gi
    limits:
      memory: 8Gi
  # PVCs. Fixed at install: a StatefulSet's volumeClaimTemplates cannot change.
  storage:
    statefulset:
      storageClassName: ""
      sizes:
        persistent: 10Gi
        data: 10Gi
        srv: 5Gi
        unifi: 10Gi
        log: 5Gi
        mongodb: 10Gi
  # Gateway API routes; each needs a matching listener (sectionName) on parentRef.
  gateway:
    parentRef:
      name: ""
      namespace: ""
    httpRouteInform:
      enabled: false
      hostname: ""
      sectionName: ""
      backendPort: 8080
    httpRoute:
      enabled: false
      hostname: ""
      sectionName: ""
      backendPort: 443
    tcpRoute:
      enabled: false
      sectionName: ""
      backendPort: 8080
    udpRoutes:
      discovery:
        enabled: false
        sectionName: ""
        backendPort: 10003
      stun:
        enabled: false
        sectionName: ""
        backendPort: 3478
      syslog:
        enabled: false
        sectionName: ""
        backendPort: 5514
  # Services: unifi (HTTPS + TCP), hotspot (portal redirects), udp (STUN,
  # syslog, discovery). Each takes type, annotations, externalTrafficPolicy.
  service:
    type: ClusterIP
    annotations: {}
  hotspotService:
    type: ClusterIP
    annotations: {}
  udpService:
    type: ClusterIP
    annotations: {}
    externalTrafficPolicy: ""  # Local keeps client source IPs (LoadBalancer/NodePort)
  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  affinity: {}
  tolerations: []
  priorityClassName: ""
  terminationGracePeriodSeconds: null
  topologySpreadConstraints: []
  runtimeClassName: ""
  hostAliases: []
  dnsPolicy: ""
  dnsConfig: {}
  podSecurityContext: {}
  securityContext: {}         # merged over privileged: true, runAsUser: 0 (systemd as PID 1)
  resourceClaims: []          # e.g. a DRA NIC for L2 device discovery without hostNetwork
  extraEnv: []
  extraVolumes: []
  extraVolumeMounts: []
  extraInitContainers: []     # run after the built-in init container
  serviceAccountName: ""
  journalctl:
    resources:
      requests:
        cpu: 25m
        memory: 64Mi
      limits:
        cpu: 250m
        memory: 256Mi
  discoveryShim:
    image:
      repository: node
      tag: "24-alpine"
    resources:
      requests:
        cpu: 10m
        memory: 32Mi
      limits:
        cpu: 100m
        memory: 64Mi
