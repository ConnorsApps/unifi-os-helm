{{- $pg := include "unifi-os.postgres" . | fromYaml }}
{{- $mq := include "unifi-os.rabbitmq" . | fromYaml }}
{{- if $mq.managed }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "rabbitmq-auth") | nindent 2 }}
type: Opaque
stringData:
  password: {{ $mq.password | quote }}
  erlang-cookie: {{ $mq.erlangCookie | quote }}
{{- end }}
{{- if $pg.managed }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-pg-auth") | nindent 2 }}
type: kubernetes.io/basic-auth
stringData:
  username: unifi-core
  password: {{ $pg.password | quote }}
{{- end }}
{{- /* One pg-login-<role> per CNPG role (bundled PostgreSQL, password mode). */}}
{{- if and .Values.postgres.enabled (not $pg.useExistingSecrets) $pg.password }}
{{- range .Values.postgres.cluster.roles }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "unifi-os.metadata" (dict "root" $ "name" (printf "pg-login-%s" .name)) | nindent 2 }}
type: kubernetes.io/basic-auth
stringData:
  username: {{ .name }}
  password: {{ $pg.password | quote }}
{{- end }}
{{- end }}
{{- if and .Values.backup.enabled (not .Values.backup.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-backup-secret") | nindent 2 }}
type: Opaque
stringData:
  password: {{ .Values.backup.password | quote }}
  storageUrl: {{ .Values.backup.storageUrl | quote }}
{{- end }}
{{- if and .Values.unifiExporter.enabled (not .Values.unifiExporter.existingSecret.name) }}
---
apiVersion: v1
kind: Secret
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-exporter-secret") | nindent 2 }}
type: Opaque
stringData:
  password: {{ .Values.unifiExporter.config.password | quote }}
  api-key: {{ .Values.unifiExporter.config.apiKey | quote }}
{{- end }}
