{{- /* Lets a TLS-terminating Gateway re-encrypt to UniFi's nginx (HTTPS-only on 443). */}}
{{- if .Values.unifi.tls.backendTLSPolicy.enabled }}
{{- $btp := .Values.unifi.tls.backendTLSPolicy }}
{{- if not $btp.hostname }}
{{- fail "backendTLSPolicy requires hostname" }}
{{- end }}
{{- if not (or $btp.wellKnownCACertificates $btp.caCertificateRef.name) }}
{{- fail "backendTLSPolicy requires either wellKnownCACertificates or caCertificateRef.name" }}
{{- end }}
apiVersion: gateway.networking.k8s.io/v1
kind: BackendTLSPolicy
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-backend-tls") | nindent 2 }}
spec:
  targetRefs:
    - {group: "", kind: Service, name: unifi}
  validation:
    {{- if $btp.wellKnownCACertificates }}
    wellKnownCACertificates: {{ $btp.wellKnownCACertificates }}
    {{- else }}
    caCertificateRefs:
      - group: ""
        kind: ConfigMap
        name: {{ $btp.caCertificateRef.name }}
        key: {{ $btp.caCertificateRef.key | default "ca.crt" }}
    {{- end }}
    hostname: {{ $btp.hostname | quote }}
{{- end }}
