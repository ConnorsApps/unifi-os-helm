{{- /* unifi-backup: https://github.com/ConnorsApps/unifi-backup */}}
{{- if .Values.backup.enabled }}
{{- $v := .Values.backup }}
{{- $secret := $v.existingSecret.name | default "unifi-backup-secret" }}
apiVersion: batch/v1
kind: CronJob
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-backup" "component" "unifi-backup") | nindent 2 }}
spec:
  schedule: {{ $v.schedule | quote }}
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  concurrencyPolicy: Forbid
  jobTemplate:
    metadata:
      labels:
        {{- include "unifi-os.labels" (dict "root" . "component" "unifi-backup") | nindent 8 }}
    spec:
      template:
        metadata:
          {{- include "unifi-os.metadata" (dict "root" . "component" "unifi-backup" "labels" $v.podLabels "annotations" $v.podAnnotations) | nindent 10 }}
        spec:
          {{- include "unifi-os.podSpec" (dict "root" . "values" $v) | nindent 10 }}
          restartPolicy: OnFailure
          containers:
            - name: backup
              image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
              imagePullPolicy: {{ $v.image.pullPolicy | quote }}
              {{- with $v.securityContext }}
              securityContext:
                {{- toYaml . | nindent 16 }}
              {{- end }}
              args: ["-config", "/config/config.yaml"]
              env:
                - name: UNIFI_PASS
                  valueFrom:
                    secretKeyRef: {name: {{ $secret }}, key: {{ $v.existingSecret.passwordKey }}}
                - name: UNIFI_USER
                  value: {{ $v.username | quote }}
                - name: STORAGE_URL
                  valueFrom:
                    secretKeyRef: {name: {{ $secret }}, key: {{ $v.existingSecret.storageUrlKey }}}
                {{- with $v.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              volumeMounts:
                - {name: config, mountPath: /config, readOnly: true}
                {{- with $v.extraVolumeMounts }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml $v.resources | nindent 16 }}
          volumes:
            - {name: config, configMap: {name: unifi-backup-config}}
            {{- with $v.extraVolumes }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
{{- end }}
