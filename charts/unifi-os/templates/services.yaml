{{- /* unifi: HTTPS UI + TCP app ports. hotspot and udp are separate so they can be exposed differently (LoadBalancer, UDPRoute, ...). */}}
{{- $ports := include "unifi-os.ports" . | fromYaml }}
{{- range $name, $svc := dict "unifi" .Values.unifi.service "hotspot" .Values.unifi.hotspotService "udp" .Values.unifi.udpService }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "unifi-os.metadata" (dict "root" $ "name" $name "annotations" $svc.annotations) | nindent 2 }}
spec:
  type: {{ $svc.type | default "ClusterIP" }}
  {{- with $svc.externalTrafficPolicy }}
  externalTrafficPolicy: {{ . }}
  {{- end }}
  selector:
    {{- include "unifi-os.selectorLabels" (dict "root" $ "component" "monolith") | nindent 4 }}
  ports:
    {{- range index $ports $name }}
    - {name: {{ .name }}, port: {{ .port }}, protocol: {{ .protocol }}}
    {{- end }}
{{- end }}
{{- if .Values.unifiExporter.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-exporter" "component" "unifi-exporter" "annotations" .Values.unifiExporter.service.annotations) | nindent 2 }}
spec:
  type: {{ .Values.unifiExporter.service.type | default "ClusterIP" }}
  selector:
    {{- include "unifi-os.selectorLabels" (dict "root" . "component" "unifi-exporter") | nindent 4 }}
  ports:
    - {name: metrics, port: 9130, targetPort: metrics, protocol: TCP}
{{- end }}
