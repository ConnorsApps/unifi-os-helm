{{- /* Gateway API routes, one per enabled entry under unifi.gateway. */}}
{{- $gw := .Values.unifi.gateway }}
{{- $routes := list
  (dict "name" "unifi-inform" "kind" "HTTPRoute" "route" $gw.httpRouteInform "service" "unifi" "path" "/inform")
  (dict "name" "unifi-https" "kind" "HTTPRoute" "route" $gw.httpRoute "service" "unifi")
  (dict "name" "unifi-http-8080" "kind" "TCPRoute" "route" $gw.tcpRoute "service" "unifi")
  (dict "name" "unifi-ap-discovery" "kind" "UDPRoute" "route" $gw.udpRoutes.discovery "service" "udp")
  (dict "name" "unifi-stun" "kind" "UDPRoute" "route" $gw.udpRoutes.stun "service" "udp")
  (dict "name" "unifi-remote-syslog" "kind" "UDPRoute" "route" $gw.udpRoutes.syslog "service" "udp") }}
{{- range $routes }}
{{- if .route.enabled }}
---
apiVersion: gateway.networking.k8s.io/{{ ternary "v1" "v1alpha2" (eq .kind "HTTPRoute") }}
kind: {{ .kind }}
metadata:
  {{- include "unifi-os.metadata" (dict "root" $ "name" .name) | nindent 2 }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ $gw.parentRef.name | quote }}
      namespace: {{ $gw.parentRef.namespace | quote }}
      sectionName: {{ .route.sectionName | quote }}
  {{- if eq .kind "HTTPRoute" }}
  hostnames:
    - {{ .route.hostname | quote }}
  {{- end }}
  rules:
    - backendRefs:
        - name: {{ .service }}
          port: {{ .route.backendPort }}
      {{- with .path }}
      matches:
        - path: {type: PathPrefix, value: {{ . }}}
      {{- end }}
{{- end }}
{{- end }}
