# ------------------------------------------------------------------
# Gateway API / Istio routing objects
# ------------------------------------------------------------------
{{- if .Values.unifi.gateway.httpRouteInform.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: unifi-inform
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "unifi-os.labels" (dict "root" . "component" "") | nindent 4 }}
  {{- with .Values.commonAnnotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  parentRefs:
    - kind: Gateway
      name: {{ .Values.unifi.gateway.parentRef.name | quote }}
      namespace: {{ .Values.unifi.gateway.parentRef.namespace | quote }}
      sectionName: {{ .Values.unifi.gateway.httpRouteInform.sectionName | quote }}
  hostnames:
    - {{ .Values.unifi.gateway.httpRouteInform.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /inform
      backendRefs:
        - name: unifi
          port: {{ .Values.unifi.gateway.httpRouteInform.backendPort }}
{{- end }}
