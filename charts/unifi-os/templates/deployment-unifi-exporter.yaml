{{- /* unpoller: https://github.com/unpoller/unpoller */}}
{{- if .Values.unifiExporter.enabled }}
{{- $v := .Values.unifiExporter }}
{{- $secret := $v.existingSecret.name | default "unifi-exporter-secret" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-exporter" "component" "unifi-exporter") | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "unifi-os.selectorLabels" (dict "root" . "component" "unifi-exporter") | nindent 6 }}
  template:
    metadata:
      {{- include "unifi-os.metadata" (dict "root" . "component" "unifi-exporter" "labels" $v.podLabels "annotations" $v.podAnnotations) | nindent 6 }}
    spec:
      {{- include "unifi-os.podSpec" (dict "root" . "values" $v) | nindent 6 }}
      containers:
        - name: main
          image: "{{ $v.image.repository }}:{{ $v.image.tag }}"
          imagePullPolicy: {{ $v.image.pullPolicy | quote }}
          {{- with $v.securityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          ports:
            - {name: metrics, containerPort: 9130, protocol: TCP}
          env:
            - name: UP_UNIFI_DEFAULT_URL
              value: {{ $v.config.url | default (printf "https://unifi.%s.svc.cluster.local" .Release.Namespace) | quote }}
            - name: UP_UNIFI_DEFAULT_USER
              value: {{ $v.config.username | quote }}
            - name: UP_UNIFI_DEFAULT_PASS
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: {{ $v.existingSecret.passwordKey | quote }}, optional: true}
            - name: UP_UNIFI_DEFAULT_API_KEY
              valueFrom:
                secretKeyRef: {name: {{ $secret }}, key: {{ $v.existingSecret.apiKeyKey | quote }}, optional: true}
            - {name: UP_PROMETHEUS_DISABLE, value: "false"}
            - {name: UP_INFLUXDB_DISABLE, value: "true"}
            {{- range $env, $key := dict
                  "UP_UNIFI_DEFAULT_VERIFY_SSL" "verifyTLS"
                  "UP_UNIFI_DEFAULT_SAVE_SITES" "saveSites"
                  "UP_UNIFI_DEFAULT_SAVE_DPI" "saveDpi"
                  "UP_UNIFI_DEFAULT_SAVE_EVENTS" "saveEvents"
                  "UP_UNIFI_DEFAULT_SAVE_ALARMS" "saveAlarms"
                  "UP_UNIFI_DEFAULT_SAVE_ANOMALIES" "saveAnomalies"
                  "UP_UNIFI_DEFAULT_SAVE_IDS" "saveIds"
                  "UP_UNIFI_DEFAULT_HASH_PII" "hashPii"
                  "UP_PROMETHEUS_REPORT_ERRORS" "reportErrors" }}
            - {name: {{ $env }}, value: {{ index $v.config $key | toString | quote }}}
            {{- end }}
            {{- with $v.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml $v.resources | nindent 12 }}
          {{- with $v.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          livenessProbe:
            httpGet: {path: /, port: metrics}
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /, port: metrics}
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
      {{- with $v.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
