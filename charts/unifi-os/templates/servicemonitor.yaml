{{- /* Requires the Prometheus Operator CRDs. */}}
{{- if and .Values.unifiExporter.enabled .Values.unifiExporter.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-exporter") | nindent 2 }}
spec:
  selector:
    matchLabels:
      {{- include "unifi-os.selectorLabels" (dict "root" . "component" "unifi-exporter") | nindent 6 }}
  endpoints:
    - port: metrics
      path: /metrics
      interval: {{ .Values.unifiExporter.serviceMonitor.interval | quote }}
      scrapeTimeout: {{ .Values.unifiExporter.serviceMonitor.scrapeTimeout | quote }}
{{- end }}
