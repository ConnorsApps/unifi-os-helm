{{- /* Mounted in the init container, which copies these into /data (see files/init.sh). */}}
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "config-overrides") | nindent 2 }}
data:
  # unifi-core override: log to the console.
  production.yaml: |-
    logs:
      enableConsole: true
  # <service>.config.props: appended to /data/<service>/ws/config.props after the
  # DB settings. Log to stdout; ucs services run without cloud identity.
  ulp-go.config.props: |-
    log.std = true
    log.redirect_std_output = false
    log.std_to_file.enable = false
  ucs-agent.config.props: |-
    log.std = true
    log.redirect_std_output = false
    log.std_to_file.enable = false
  unifi-directory.config.props: |-
    log.std = true
    log.redirect_std_output = false
    log.std_to_file.enable = false
  unifi-identity-update.config.props: |-
    log.std = true
    log.file = false
    log.redirect_std_output = false
  uid.config.props: |-
    log.std = true
    log.redirect_std_output = false
    log.std_to_file.enable = false
  unifi-credential-server.config.props: |-
    log.std = true
    log.redirect_std_output = false
    log.std_to_file.enable = false
    identity.device.auth = false
    identity.cloud.env = dev
    identity.support_cloud_token =
    cloud.env = dev
  ucs-user-assets.config.props: |-
    identity.cloud.env = dev
    identity.support_cloud_token =
    identity.device.auth = false
    cloud.env = dev
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "discovery-shim-script") | nindent 2 }}
data:
  shim.js: |-
    {{- .Files.Get "files/discovery-shim.js" | trimSuffix "\n" | nindent 4 }}
{{- if .Values.backup.enabled }}
{{- $cfg := deepCopy .Values.backup.config }}
{{- $_ := set $cfg.unifi "url" ($cfg.unifi.url | default (printf "https://unifi.%s.svc.cluster.local" .Release.Namespace)) }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "unifi-backup-config") | nindent 2 }}
data:
  config.yaml: |
    {{- toYaml $cfg | nindent 4 }}
{{- end }}
