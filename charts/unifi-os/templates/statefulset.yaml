{{- /* Single pod running upstream systemd (PostgreSQL/RabbitMQ external, MongoDB embedded). */}}
{{- include "unifi-os.rejectHullValues" . }}
{{- $pg := include "unifi-os.postgres" . | fromYaml }}
{{- $mq := include "unifi-os.rabbitmq" . | fromYaml }}
{{- $image := printf "%s:%s" .Values.image.repository (.Values.image.tag | default .Chart.AppVersion) }}
{{- $tlsSecret := .Values.unifi.tls.existingSecret }}
{{- if .Values.unifi.tls.certManager.enabled }}
{{- $tlsSecret = .Values.unifi.tls.certManager.secretName | default "unifi-tls" }}
{{- end }}
{{- $storage := .Values.unifi.storage.statefulset }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  {{- include "unifi-os.metadata" (dict "root" . "name" "monolith" "component" "monolith") | nindent 2 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "unifi-os.selectorLabels" (dict "root" . "component" "monolith") | nindent 6 }}
  template:
    metadata:
      {{- include "unifi-os.metadata" (dict "root" . "component" "monolith" "labels" .Values.unifi.podLabels "annotations" .Values.unifi.podAnnotations) | nindent 6 }}
    spec:
      {{- include "unifi-os.podSpec" (dict "root" . "values" .Values.unifi) | nindent 6 }}
      initContainers:
        - name: init
          image: {{ $image }}
          command:
            - /bin/bash
            - -c
            - |
              {{- .Files.Get "files/init.sh" | nindent 14 }}
          env:
            - name: UOS_UUID
              value: "3403e723-3f5b-5a1e-9b88-ed7e2fcfd762"
            - name: PGHOST
              value: {{ $pg.host | quote }}
            - name: PGPORT
              value: {{ $pg.port | quote }}
            - name: PGDATABASE
              value: {{ $pg.database | quote }}
            - name: PGUSER
              value: {{ $pg.user | quote }}
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $pg.secretName }}
                  key: {{ $pg.passwordKey }}
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: srv, mountPath: /srv}
            - {name: persistent, mountPath: /persistent}
            - {name: override-config-secrets, mountPath: /run/secrets/overrides, readOnly: true}
            {{- if $tlsSecret }}
            - {name: unifi-tls-secret, mountPath: /run/secrets/tls, readOnly: true}
            {{- end }}
        {{- with .Values.unifi.extraInitContainers }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      containers:
        - name: unifi-os
          image: {{ $image }}
          imagePullPolicy: Always
          securityContext:
            {{- /* systemd as PID 1 needs a privileged root container. */}}
            {{- toYaml (mergeOverwrite (dict "privileged" true "runAsUser" 0) (deepCopy (.Values.unifi.securityContext | default dict))) | nindent 12 }}
          command:
            - /bin/bash
            - -c
            - |
              {{- .Files.Get "files/start.sh" | nindent 14 }}
          env:
            - name: UOS_SYSTEM_IP
              value: {{ .Values.unifi.uosSystemIP | default "" | quote }}
            - name: PGHOST
              value: {{ $pg.host | quote }}
            - name: PGPORT
              value: {{ $pg.port | quote }}
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $mq.secretName }}
                  key: {{ $mq.passwordKey }}
            - name: RABBITMQ_URI
              value: {{ $mq.uri | quote }}
            {{- with .Values.unifi.extraEnv }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          ports:
            {{- $ports := include "unifi-os.ports" . | fromYaml }}
            {{- range $svc := list "unifi" "hotspot" "udp" }}
            {{- range index $ports $svc }}
            - {name: {{ .name }}, containerPort: {{ .port }}, protocol: {{ .protocol }}}
            {{- end }}
            {{- end }}
          readinessProbe:
            httpGet: {scheme: HTTPS, path: /, port: 443}
            initialDelaySeconds: 90
            periodSeconds: 15
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          livenessProbe:
            httpGet: {scheme: HTTPS, path: /, port: 443}
            initialDelaySeconds: 180
            periodSeconds: 20
            timeoutSeconds: 5
            successThreshold: 1
            failureThreshold: 6
          volumeMounts:
            - {name: data, mountPath: /data}
            - {name: srv, mountPath: /srv}
            - {name: unifi, mountPath: /var/lib/unifi}
            - {name: mongodb, mountPath: /var/lib/mongodb}
            - {name: log, mountPath: /var/log}
            - {name: persistent, mountPath: /persistent}
            - {name: run, mountPath: /run}
            - {name: run-lock, mountPath: /run/lock}
            - {name: cgroup, mountPath: /sys/fs/cgroup}
            {{- if .Values.postgres.enabled }}
            {{- /* Read by the psql/createdb/... wrappers baked into the image. */}}
            - {name: postgres-superuser-auth, mountPath: /run/secrets/postgres-superuser/pgpass, subPath: pgpass, readOnly: true}
            {{- end }}
            {{- with .Values.unifi.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
          resources:
            {{- toYaml .Values.unifi.resources | nindent 12 }}
        - name: journalctl
          image: {{ $image }}
          imagePullPolicy: Always
          securityContext:
            runAsUser: 0
          command:
            - /bin/bash
            - -c
            - |
              set -e
              # Follow the systemd journal (all machine-id dirs) for kubectl logs -c journalctl,
              # once systemd has created it.
              while ! compgen -G "/run/log/journal/*/*.journal" > /dev/null \
                && ! compgen -G "/var/log/journal/*/*.journal" > /dev/null; do
                sleep 2
              done
              journal_dirs=()
              [ -d /run/log/journal ] && journal_dirs+=(--directory=/run/log/journal)
              [ -d /var/log/journal ] && journal_dirs+=(--directory=/var/log/journal)
              exec journalctl -f -o short-iso --no-pager --merge "${journal_dirs[@]}" | cut -c 27-
          volumeMounts:
            - {name: run, mountPath: /run}
            - {name: log, mountPath: /var/log}
          resources:
            {{- toYaml .Values.unifi.journalctl.resources | nindent 12 }}
        - name: discovery-shim
          image: "{{ .Values.unifi.discoveryShim.image.repository }}:{{ .Values.unifi.discoveryShim.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: [node, --watch, /scripts/shim.js]
          volumeMounts:
            - {name: discovery-shim-script, mountPath: /scripts}
          resources:
            {{- toYaml .Values.unifi.discoveryShim.resources | nindent 12 }}
      volumes:
        - {name: run, emptyDir: {medium: Memory}}
        - {name: run-lock, emptyDir: {medium: Memory}}
        - {name: cgroup, hostPath: {path: /sys/fs/cgroup, type: Directory}}
        - name: override-config-secrets
          projected:
            sources:
              - configMap:
                  name: config-overrides
              {{- /* Per-role credentials. Chart-created when postgres.enabled; see DATABASE.md. */}}
              {{- range list "ulp-go" "uid" "unifi-credential-server" "unifi-directory" "ucs-agent" "unifi-identity-update" }}
              - secret:
                  name: pg-login-{{ . }}
                  optional: true
                  items:
                    - {key: username, path: {{ . }}/db.username}
                    - {key: password, path: {{ . }}/db.password}
              {{- end }}
        - name: discovery-shim-script
          configMap:
            name: discovery-shim-script
            defaultMode: 0755
        {{- if .Values.postgres.enabled }}
        - name: postgres-superuser-auth
          secret:
            secretName: {{ printf "%s-superuser" (.Values.postgres.fullnameOverride | default "unifi-postgres") }}
        {{- end }}
        {{- if $tlsSecret }}
        - name: unifi-tls-secret
          secret:
            secretName: {{ $tlsSecret }}
        {{- end }}
        {{- with .Values.unifi.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
  {{- /* volumeClaimTemplates are immutable: keep names, order and fields as they are. */}}
  volumeClaimTemplates:
    {{- range $name := list "persistent" "data" "srv" "unifi" "log" "mongodb" }}
    - metadata:
        name: {{ $name }}
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ $storage.storageClassName | quote }}
        resources:
          requests:
            storage: {{ index $storage.sizes $name | quote }}
    {{- end }}
