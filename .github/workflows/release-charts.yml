name: Release Helm Chart

on:
  push:
    branches: [main]
  workflow_dispatch: {}

jobs:
  release:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: azure/setup-helm@v5

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      # README links are absolute, so it works as the chart README unchanged.
      - name: Prepare chart
        run: |
          cp README.md charts/unifi-os/README.md
          helm repo add cloudnative-pg https://cloudnative-pg.github.io/charts
          helm dependency update charts/unifi-os

      - uses: helm/chart-releaser-action@v1.7.0
        with:
          charts_dir: charts
          skip_existing: true
        env:
          CR_TOKEN: "${{ secrets.GITHUB_TOKEN }}"

      - name: Publish README as the GitHub Pages index
        run: |
          git fetch origin gh-pages
          git worktree add /tmp/gh-pages origin/gh-pages
          cp README.md /tmp/gh-pages/index.md
          git -C /tmp/gh-pages add index.md
          git -C /tmp/gh-pages diff --cached --quiet && { echo "index.md unchanged"; exit 0; }
          git -C /tmp/gh-pages commit -m "docs: sync GitHub Pages landing content"
          git -C /tmp/gh-pages push origin HEAD:gh-pages
