name: Publish Docker Image

on:
  push:
    branches: [main]
    paths: [Dockerfile, "image/**", uos-version.env]
  workflow_dispatch: {}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      # uos-version.env pins the version and per-arch installers; arm64 builds
      # only when its installer is pinned.
      - name: Load uos-version.env
        run: |
          grep -v '^#' uos-version.env >> "$GITHUB_ENV"
          . ./uos-version.env
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/unifi-os" >> "$GITHUB_ENV"
          echo "PLATFORMS=linux/amd64${UOS_INSTALLER_URL_ARM64:+,linux/arm64}" >> "$GITHUB_ENV"

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: ${{ env.PLATFORMS }}
          tags: ${{ env.IMAGE }}:${{ env.UOS_VERSION }}
          build-args: |
            UOS_INSTALLER_URL_AMD64=${{ env.UOS_INSTALLER_URL_AMD64 }}
            UOS_INSTALLER_SHA256_AMD64=${{ env.UOS_INSTALLER_SHA256_AMD64 }}
            UOS_INSTALLER_URL_ARM64=${{ env.UOS_INSTALLER_URL_ARM64 }}
            UOS_INSTALLER_SHA256_ARM64=${{ env.UOS_INSTALLER_SHA256_ARM64 }}
